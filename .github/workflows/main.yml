name: Generate GitHub Stats Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats images
        uses: dev-aniketj/github-stats-transparent@main
        with:
          github_token: ${{ secrets.ACCESS_TOKEN }}