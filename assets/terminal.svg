<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="t">
  <title id="t">Terminal card summarising Sahil Munj's focus areas</title>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <style>
      text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; }
      .p { fill: #22d3ee; } .k { fill: #a78bfa; } .v { fill: #e2e8f0; } .c { fill: #475569; } .s { fill: #86efac; }
      .l { animation: show .01s linear backwards; }
      .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.0s; } .l3 { animation-delay: 1.5s; }
      .l4 { animation-delay: 2.0s; } .l5 { animation-delay: 2.5s; } .l6 { animation-delay: 3.0s; }
      .l7 { animation-delay: 3.6s; } .l8 { animation-delay: 4.3s; }
      .cur { animation: blink 1s steps(2,start) infinite; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="299" rx="14" fill="url(#tbg)" stroke="#1e293b"/>
  <rect x="0.5" y="0.5" width="519" height="34" rx="14" fill="#0f172a"/>
  <rect x="0.5" y="20" width="519" height="15" fill="#0f172a"/>
  <circle cx="20" cy="18" r="5" fill="#f87171"/>
  <circle cx="38" cy="18" r="5" fill="#fbbf24"/>
  <circle cx="56" cy="18" r="5" fill="#34d399"/>
  <text x="260" y="22" text-anchor="middle" class="c">sahil@dev: ~/about</text>
  <rect x="0.5" y="34.5" width="519" height="1" fill="url(#accent)" opacity=".6"/>

  <text class="l l1" x="22" y="66"><tspan class="p">$</tspan> <tspan class="v">cat profile.json</tspan></text>
  <text class="l l2" x="22" y="92"><tspan class="v">{</tspan></text>
  <text class="l l3" x="40" y="116"><tspan class="k">"role"</tspan><tspan class="v">: </tspan><tspan class="s">"Computer Engineering Student"</tspan><tspan class="v">,</tspan></text>
  <text class="l l4" x="40" y="140"><tspan class="k">"builds"</tspan><tspan class="v">: [</tspan><tspan class="s">"web apps"</tspan><tspan class="v">, </tspan><tspan class="s">"AI tools"</tspan><tspan class="v">, </tspan><tspan class="s">"dashboards"</tspan><tspan class="v">],</tspan></text>
  <text class="l l5" x="40" y="164"><tspan class="k">"stack"</tspan><tspan class="v">: [</tspan><tspan class="s">"JavaScript"</tspan><tspan class="v">, </tspan><tspan class="s">"TypeScript"</tspan><tspan class="v">, </tspan><tspan class="s">"Python"</tspan><tspan class="v">],</tspan></text>
  <text class="l l6" x="40" y="188"><tspan class="k">"focus"</tspan><tspan class="v">: </tspan><tspan class="s">"practical software, intelligent systems"</tspan><tspan class="v">,</tspan></text>
  <text class="l l7" x="40" y="212"><tspan class="k">"learning"</tspan><tspan class="v">: </tspan><tspan class="s">"always"</tspan></text>
  <text class="l l8" x="22" y="236"><tspan class="v">}</tspan></text>
  <text class="l l8" x="22" y="268"><tspan class="p">$</tspan> <tspan class="cur v">▍</tspan></text>
</svg>
