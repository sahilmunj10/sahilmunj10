<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Sahil Munj — Computer Engineering Student, Software Developer, AI and Data Enthusiast</title>
  <desc id="desc">Animated dark banner with electric blue and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0b0a1f"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6f3ff"/>
      <stop offset="50%" stop-color="#6fd6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a8a" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .name { font-size: 64px; font-weight: 800; letter-spacing: 1px; fill: url(#nameGrad); }
      .sub  { font-size: 17px; font-weight: 500; fill: #93c5fd; letter-spacing: 3px; }
      .tag  { font-size: 14px; fill: #64748b; }
      .code { font-size: 13px; fill: #22d3ee; opacity: 0.85; }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      .orb3 { animation: drift3 16s ease-in-out infinite alternate; }
      .scan { animation: scan 6s linear infinite; }
      .fade1 { animation: fadeUp 1.1s ease-out 0.2s backwards; }
      .fade2 { animation: fadeUp 1.1s ease-out 0.6s backwards; }
      .fade3 { animation: fadeUp 1.1s ease-out 1.0s backwards; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .node { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: 0.8s; } .n3 { animation-delay: 1.6s; }
      @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(90px, 30px); } }
      @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-80px, -25px); } }
      @keyframes drift3 { from { transform: translate(0,0); } to { transform: translate(40px, -40px); } }
      @keyframes scan { from { transform: translateX(-600px); } to { transform: translateX(1300px); } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <!-- ambient orbs -->
    <circle class="orb1" cx="180" cy="80" r="190" fill="url(#orbBlue)"/>
    <circle class="orb2" cx="1020" cy="220" r="210" fill="url(#orbViolet)"/>
    <circle class="orb3" cx="700" cy="40" r="150" fill="url(#orbCyan)"/>

    <!-- scanning light beam -->
    <rect class="scan" x="0" y="0" width="420" height="280" fill="url(#lineGrad)" opacity="0.12"/>

    <!-- decorative circuit path (right side) -->
    <g fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.4">
      <path d="M 860 60 H 980 L 1010 90 H 1120"/>
      <path d="M 880 140 H 960 L 990 110 H 1060 L 1080 130 H 1150"/>
      <path d="M 900 215 H 1000 L 1030 185 H 1130"/>
    </g>
    <g fill="#22d3ee" filter="url(#softGlow)">
      <circle class="node" cx="860" cy="60" r="3.5"/>
      <circle class="node n2" cx="1120" cy="90" r="3.5"/>
      <circle class="node n3" cx="880" cy="140" r="3.5"/>
      <circle class="node n2" cx="1150" cy="130" r="3.5"/>
      <circle class="node n3" cx="900" cy="215" r="3.5"/>
      <circle class="node" cx="1130" cy="185" r="3.5"/>
    </g>

    <!-- terminal-style prompt -->
    <text class="mono code fade1" x="72" y="86">~/sahilmunj10 $ whoami</text>

    <!-- name -->
    <text class="sans name fade2" x="70" y="156" filter="url(#glow)">Sahil Munj</text>

    <!-- subtitle -->
    <text class="sans sub fade3" x="72" y="194">COMPUTER ENGINEERING STUDENT  ·  SOFTWARE DEVELOPER  ·  AI &amp; DATA ENTHUSIAST</text>

    <!-- tagline -->
    <text class="mono tag fade3" x="72" y="230">&gt; building practical software &amp; exploring intelligent systems<tspan class="blink" fill="#22d3ee">_</tspan></text>

    <!-- bottom accent line -->
    <rect x="0" y="276" width="1200" height="4" fill="url(#lineGrad)" class="pulse"/>
  </g>

  <!-- frame border -->
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#1e293b" stroke-opacity="0.9"/>
</svg>
